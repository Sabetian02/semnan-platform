<!doctype html>
<html lang="fa">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>داشبورد مدیریت | پلتفرم دانشگاه سمنان</title>
  <link rel="icon" type="image/svg+xml" href="../assets/images/SVG/logo.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    html, body {
      background: linear-gradient(165deg, #f4f1e7 0%, #eef2fb 100%) !important;
    }
    body {
      font-family: "Vazirmatn", "Segoe UI", Tahoma, system-ui, sans-serif !important;
      color: #22355c;
    }
    #root {
      min-height: 100vh;
    }
    /* تیترها با رنگ برند */
    h1, h2, h3, h4, h5, h6 {
      color: #102A71 !important;
    }
    a {
      color: #102A71 !important;
    }
    /* ورودی‌ها و ناحیه‌های متنی */
    input[type="text"],
    input[type="url"],
    input[type="email"],
    input[type="search"],
    input[type="date"],
    input[type="datetime-local"],
    textarea,
    select {
      border-radius: 10px !important;
      border: 1.5px solid #d8dde8 !important;
      background: #ffffff !important;
      color: #102A71 !important;
      transition: border-color .15s ease, box-shadow .15s ease;
    }
    input:focus,
    textarea:focus,
    select:focus {
      border-color: #102A71 !important;
      outline: none !important;
      box-shadow: 0 0 0 3px rgba(16, 42, 113, 0.10) !important;
    }
    /* دکمه‌ها */
    button {
      border-radius: 10px !important;
      font-family: "Vazirmatn", "Segoe UI", Tahoma, system-ui, sans-serif !important;
    }
    button:not([disabled]):hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 14px rgba(16, 42, 113, 0.15) !important;
    }
    button:active:not([disabled]) {
      transform: translateY(0);
    }
    /* کارت‌ها */
    [class*="card"] {
      border-radius: 14px !important;
      border: 1px solid rgba(16, 42, 113, 0.08) !important;
    }
    /* اسکرول‌بار */
    ::-webkit-scrollbar { width: 10px; height: 10px; }
    ::-webkit-scrollbar-thumb {
      background: #c3cbe0;
      border-radius: 8px;
    }
    ::-webkit-scrollbar-thumb:hover { background: #102A71; }
    ::-webkit-scrollbar-track { background: transparent; }
  </style>
</head>
<body>
  <!-- Decap CMS (سایت مدیریت محتوای پلتفرم دانشگاه سمنان) -->
  <script src="https://unpkg.com/decap-cms@^3.6.1/dist/decap-cms.js"></script>

  <!-- ویجت سفارشی فیلد «اعتبار تا» — حذف شد؛ فیلد متنی ساده است -->
</body>
</html>
