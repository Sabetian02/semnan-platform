<!doctype html>
<html lang="fa">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>داشبورد مدیریت | پلتفرم دانشگاه سمنان</title>
  <link rel="icon" type="image/svg+xml" href="../assets/images/SVG/logo.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    html, body {
      background: linear-gradient(165deg, #f4f1e7 0%, #eef2fb 100%) !important;
    }
    body {
      font-family: "Vazirmatn", "Segoe UI", Tahoma, system-ui, sans-serif !important;
      color: #22355c;
    }
    #root {
      min-height: 100vh;
    }
    /* تیترها با رنگ برند */
    h1, h2, h3, h4, h5, h6 {
      color: #102A71 !important;
    }
    a {
      color: #102A71 !important;
    }
    /* ورودی‌ها و ناحیه‌های متنی */
    input[type="text"],
    input[type="url"],
    input[type="email"],
    input[type="search"],
    input[type="date"],
    input[type="datetime-local"],
    textarea,
    select {
      border-radius: 10px !important;
      border: 1.5px solid #d8dde8 !important;
      background: #ffffff !important;
      color: #102A71 !important;
      transition: border-color .15s ease, box-shadow .15s ease;
    }
    input:focus,
    textarea:focus,
    select:focus {
      border-color: #102A71 !important;
      outline: none !important;
      box-shadow: 0 0 0 3px rgba(16, 42, 113, 0.10) !important;
    }
    /* دکمه‌ها */
    button {
      border-radius: 10px !important;
      font-family: "Vazirmatn", "Segoe UI", Tahoma, system-ui, sans-serif !important;
    }
    button:not([disabled]):hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 14px rgba(16, 42, 113, 0.15) !important;
    }
    button:active:not([disabled]) {
      transform: translateY(0);
    }
    /* کارت‌ها */
    [class*="card"] {
      border-radius: 14px !important;
      border: 1px solid rgba(16, 42, 113, 0.08) !important;
    }
    /* اسکرول‌بار */
    ::-webkit-scrollbar { width: 10px; height: 10px; }
    ::-webkit-scrollbar-thumb {
      background: #c3cbe0;
      border-radius: 8px;
    }
    ::-webkit-scrollbar-thumb:hover { background: #102A71; }
    ::-webkit-scrollbar-track { background: transparent; }

    /* ویجت تقویم شمسی */
    .jd-wrap { font-family: "Vazirmatn", "Segoe UI", Tahoma, sans-serif; }
    .jd-forever { display: flex; align-items: center; gap: 9px; margin: 4px 0 6px; font-weight: 700; color: #102A71; }
    .jd-forever input { width: auto !important; margin: 0 !important; flex: none; }
    .jd-cal {
      border: 1px solid #d8dde8; border-radius: 12px; padding: 10px;
      max-width: 300px; margin-top: 8px; background: #fff;box-shadow: 0 6px 18px -10px rgba(16,42,113,.25);
    }
    .jd-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
    .jd-head b { color: #102A71; font-size: .92rem; }
    .jd-head button, .jd-btn { border: 1px solid #d8dde8; border-radius: 8px; padding: 2px 12px; font-family: inherit; cursor: pointer; background: rgba(16,42,113,.04); color: #102A71; font-weight: 700; }
    .jd-head button:hover, .jd-btn:hover { background: rgba(245,196,0,.25); }
    .jd-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; text-align: center; direction: rtl; }
    .jd-dow { font-size: .68rem; color: #8a93a8; font-weight: 700; padding: 3px 0; }
    .jd-day { border-radius: 8px; padding: 5px 0; cursor: pointer; font-size: .85rem; color: #1a2332; border: 1px solid transparent; }
    .jd-day:hover { background: rgba(245,196,0,.25); }
    .jd-day.sel { background: #102A71; color: #fff; }
    .jd-day.today { box-shadow: inset 0 0 0 2px #F5C400; }
    .jd-day.empty { visibility: hidden; }
    .jd-out { font-size: .78rem; color: #102A71; font-weight: 700; margin-top: 7px; }
    .jd-hint { font-size: .72rem; color: #5c6575; margin-top: 4px; }
  </style>
</head>
<body>
  <!-- Decap CMS (سایت مدیریت محتوای پلتفرم دانشگاه سمنان) -->
  <script src="https://unpkg.com/decap-cms@^3.6.1/dist/decap-cms.js"></script>

  <!-- تقویم شمسی — تبدیل جلالی/میلادی -->
  <script src="https://cdn.jsdelivr.net/npm/jalaali-js@1.2.6/dist/jalaali.js"></script>

  <!-- ویجت تقویم شمسی برای فیلد «اعتبار تا» -->
  <script>
    (function () {
      function boot() {
        if (!window.CMS || !window.CMS.registerWidget) { setTimeout(boot, 200); return; }
        var elements = window.CMS.elements || {};
        var h = elements.createElement || window.CMS.h;
        if (!h) { setTimeout(boot, 200); return; }
        var Component = elements.Component;

        var FOREVER = "همیشگی";
        var MONTHS = ["فروردین", "اردیبهشت", "خرداد", "تیر", "مرداد", "شهریور",
          "مهر", "آبان", "آذر", "دی", "بهمن", "اسفند"];
        var DOWS = ["ش", "ی", "د", "س", "چ", "پ", "ج"];
        var fa = function (n) {
          return String(n).replace(/[0-9]/g, function (d) { return "۰۱۲۳۴۵۶۷۸۹"[+d]; });
        };
        var pad = function (n) { return (n < 10 ? "0" : "") + n; };

        function gregorianFromJalaaliInput(jy, jm, jd) {
          var g = jalaali.toGregorian(jy, jm, jd);
          return g.gy + "-" + pad(g.gm) + "-" + pad(g.gd);
        }

        function parseValue(val) {
          if (!val || val === FOREVER || val === "permanent") return { forever: true };
          var m = String(val).match(/^(\d{4})-(\d{2})-(\d{2})/);
          if (m) {
            var j = jalaali.toJalaali(+m[1], +m[2], +m[3]);
            return { forever: false, y: j.jy, m: j.jm, d: j.jd, val: val };
          }
          return { forever: true };
        }

        function daysOfMonth(view) {
          var first = jalaali.toGregorian(view.y, view.m, 1);
          var col = (new Date(Date.UTC(first.gy, first.gm - 1, first.gd)).getUTCDay() + 1) % 7;
          var len = jalaali.jalaaliMonthLength(view.y, view.m);
          var cells = [];
          for (var c = 0; c < col; c++) cells.push(null);
          for (var d = 1; d <= len; d++) { cells.push(d); }
          while (cells.length % 7 !== 0) cells.push(null);
          return cells;
        }

        function JalaliDate(props) {
          var parsed = parseValue(props.value);
          var now = jalaali.toJalaali(
            new Date().getFullYear(), new Date().getMonth() + 1, new Date().getDate());
          var self = this;
          this.state = {
            forever: parsed.forever,
            y: parsed.forever ? now.jy : parsed.y,
            m: parsed.forever ? now.jm : parsed.m,
            d: parsed.forever ? null : parsed.d
          };
          this.setForever = function (ev) {
            var forever = ev.target.checked;
            self.setState({ forever: forever, d: forever ? null : self.state.d });
            props.onChange(forever ? FOREVER : (self.state.d ? gregorianFromJalaaliInput(self.state.y, self.state.m, self.state.d) : ""));
          };
          this.pick = function (d) {
            self.setState({ d: d });
            props.onChange(gregorianFromJalaaliInput(self.state.y, self.state.m, d));
          };
          this.nav = function (delta) {
            var y = self.state.y, m = self.state.m + delta;
            if (m < 1) { m = 12; y -= 1; }
            if (m > 12) { m = 1; y += 1; }
            self.setState({ y: y, m: m });
          };
          this.today = function () {
            var t = jalaali.toJalaali(
              new Date().getFullYear(), new Date().getMonth() + 1, new Date().getDate());
            self.setState({ y: t.jy, m: t.jm, d: t.jd });
            props.onChange(gregorianFromJalaaliInput(t.jy, t.jm, t.jd));
          };
        }
        JalaliDate.prototype = Object.create(Component.prototype);
        JalaliDate.prototype.constructor = JalaliDate;
        JalaliDate.prototype.render = function () {
          var st = this.state;
          var out = h("div", { className: "jd-wrap" });
          var forever = h("label", { className: "jd-forever" },
            h("input", { type: "checkbox", checked: st.forever, onChange: this.setForever }),
            "همیشگی (بدون تاریخ انقضا)");
          out.children.push(forever);
          if (!st.forever) {
            var cells = daysOfMonth({ y: st.y, m: st.m }).map(function (d) {
              if (d === null) return h("span", { className: "jd-day empty" }, "·");
              var cls = "jd-day";
              if (d === st.d) cls += " sel";
              var now = jalaali.toJalaali(new Date().getFullYear(), new Date().getMonth() + 1, new Date().getDate());
              if (d === now.jd && st.y === now.jy && st.m === now.jm) cls += " today";
              return h("span", { className: cls, onClick: (function (day) { return function () { this.pick(day); }; }).call(this, d) }, fa(d));
            }, this);
            var dows = DOWS.map(function (w) { return h("span", { className: "jd-dow" }, w); });
            var head = h("div", { className: "jd-head" },
              h("button", { onClick: (function () { this.nav(-1); }).bind(this) }, "›"),
              h("b", null, MONTHS[st.m - 1] + " " + fa(st.y)),
              h("button", { onClick: (function () { this.nav(1); }).bind(this) }, "‹"));
            var monthLen = jalaali.jalaaliMonthLength(st.y, st.m);
            var fmt = (st.d && st.d <= monthLen)
              ? fa(st.d) + " " + MONTHS[st.m - 1] + " " + fa(st.y)
              : "یک روز را از تقویم انتخاب کن";
            var grid = h("div", { className: "jd-grid" }, dows.concat(cells));
            var readout = h("div", { className: "jd-out" }, "انتخاب‌شده: " + fmt);
            var hint = h("div", { className: "jd-hint" }, "در سایت به‌صورت «چند روز تا انقضا» نمایش داده می‌شود");
            out.children.push(
              h("div", { className: "jd-cal" },
                head, grid, h("div", { style: { marginTop: "8px", textAlign: "center" } },
                  h("button", { className: "jd-head-btn", onClick: (function () { this.today(); }).bind(this) }, "امروز")),
                readout, hint));
          }
          return out;
        };

        function JalaliPreview(props) {
          var p = parseValue(props.value);
          if (p.forever) return h("span", null, "همیشگی (بدون انقضا)");
          var g = jalaali.toGregorian(p.y, p.m, p.d);
          return h("span", null, "تا " + fa(p.d) + " " + MONTHS[p.m - 1] + " " + fa(p.y));
        }

        window.CMS.registerWidget("jalali-date", JalaliDate, JalaliPreview);
      }
      boot();
    })();
  </script>
</body>
</html>
