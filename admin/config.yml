# داشبورد — نسخهٔ ساده
backend:
  name: github
  repo: Sabetian02/semnan-platform
  branch: main
  base_url: https://auth.semnanplatform.ir
  auth_endpoint: auth
  client_id: Ov23lieTbxroaVOg1N4l

media_folder: assets/images/uploads
public_folder: assets/images/uploads

slug:
  encoding: unicode
  clean_accents: false
  sanitize_replacement: "-"

locale: fa

logo:
  src: ../assets/images/SVG/logo.svg
  show_in_header: true

display_url: https://semnanplatform.ir

collections:
  - name: news
    label: اطلاعیه‌ها
    label_singular: اطلاعیه
    folder: content/news
    format: json
    create: true
    delete: true
    extension: json
    summary: "{{title}} — {{category}}"
    sortable_fields:
      - field: date
        default_sort: desc
      - field: title
    fields:
      - label: عنوان
        name: title
        widget: string
        required: true
      - label: خلاصه
        name: summary
        widget: text
        required: true
      - label: دسته
        name: category
        widget: select
        options: [ "خبر", "رویداد", "فراخوان", "اطلاع‌رسانی", "دوره", "جدید", "تخفیف" ]
        default: "خبر"
      - label: تگ‌ها / هشتگ‌ها
        name: hashtags
        widget: list
        required: false
        value_type: string
        hint: "هر کلمه را تایپ و Enter بزن؛ با کلیک روی هر تگ، همان کلمه در جستجو می‌شود"
      - label: کانون
        name: kanon
        widget: relation
        collection: kanonha
        search_fields: [ "name", "short" ]
        value_field: slug
        display_fields: [ "name" ]
        required: false
      - label: انجمن
        name: anjoman
        widget: relation
        collection: anjomanha
        search_fields: [ "name", "short" ]
        value_field: slug
        display_fields: [ "name" ]
        required: false
      - label: کانون‌های برگزارکننده / همکار
        name: co_kanons
        widget: list
        required: false
        collapsed: true
        summary: "{{fields.kanon}}"
        hint: "اگر اطلاعیه چند کانون داشته باشد، همه را این‌جا کم کرده و انتخاب کن. فیلد «کانون» بالا برای سازگاری قبلی است."
        fields:
          - label: کانون
            name: kanon
            widget: relation
            collection: kanonha
            search_fields: [ "name", "short" ]
            value_field: slug
            display_fields: [ "name" ]
            required: false
      - label: انجمن‌های برگزارکننده / همکار
        name: co_anjomans
        widget: list
        required: false
        collapsed: true
        summary: "{{fields.anjoman}}"
        hint: "اگر اطلاعیه چند انجمن داشته باشد، همه را این‌جا کم کرده و انتخاب کن. فیلد «انجمن» بالا برای سازگاری قبلی است."
        fields:
          - label: انجمن
            name: anjoman
            widget: relation
            collection: anjomanha
            search_fields: [ "name", "short" ]
            value_field: slug
            display_fields: [ "name" ]
            required: false
      - label: تصویر کاور
        name: image
        widget: image
        required: false
      - label: یا آدرس تصویر
        name: image_url
        widget: string
        required: false
        hint: "https://… — اگر هر دو پر باشد عکس آپلودی اولویت دارد"
      - label: تاریخ انتشار
        name: date
        widget: datetime
        required: true
      - label: بلوک‌های محتوا
        name: blocks
        widget: list
        required: false
        label_singular: بلوک
        collapsed: true
        summary: "{{fields.heading}} — {{type}}"
        hint: "هر بلوک را با ▲▼ جابجا کن و با «جای نمایش» بین ستون اصلی و کنار جابجا کن. اگر خالی باشد فقط خلاصه نمایش داده می‌شود."
        default:
          - type: ads
        types:
          - label: 📝 متن
            name: text
            widget: object
            fields:
              - { label: عنوان بخش, name: heading, widget: string, required: false }
              - label: جای نمایش
                name: place
                widget: select
                options:
                  - { label: ستون اصلی, value: "main" }
                  - { label: کنار, value: "side" }
                default: "main"
              - { label: متن, name: markdown, widget: markdown }
          - label: 🖼 عکس
            name: image
            widget: object
            fields:
              - { label: تصویر, name: image, widget: image }
              - { label: کپشن, name: caption, widget: string, required: false }
              - { label: alt, name: alt, widget: string, required: false }
              - label: جای نمایش
                name: place
                widget: select
                options:
                  - { label: ستون اصلی, value: "main" }
                  - { label: کنار, value: "side" }
                default: "main"
          - label: 🎬 ویدیو (آپارات)
            name: video
            widget: object
            fields:
              - { label: عنوان بخش, name: heading, widget: string, required: false }
              - { label: لینک آپارات, name: url, widget: string, required: false, hint: "مثل https://www.aparat.com/v/abc123 — فقط آپارات" }
              - { label: عنوان ویدیو, name: title, widget: string, required: false }
              - { label: توضیح, name: caption, widget: string, required: false }
              - label: جای نمایش
                name: place
                widget: select
                options:
                  - { label: ستون اصلی, value: "main" }
                  - { label: کنار, value: "side" }
                default: "main"
          - label: 📍 نقشه (نشان)
            name: location
            widget: object
            fields:
              - { label: عنوان بخش, name: heading, widget: string, required: false, default: "مکان برگزاری" }
              - { label: نام مکان, name: name, widget: string, required: false }
              - { label: نشانی, name: address, widget: string, required: false }
              - { label: لینک نشان, name: map_url, widget: string, required: false, hint: "از اپ نشان «اشتراک‌گذاری» بزن و لینک را این‌جا بگذار (nshn.ir یا neshan.org) — نقشه داخل صفحه نمایش داده می‌شود" }
              - label: جای نمایش
                name: place
                widget: select
                options:
                  - { label: ستون اصلی, value: "main" }
                  - { label: کنار, value: "side" }
                default: "main"
          - label: 📋 فرم گوگل
            name: form
            widget: object
            fields:
              - { label: عنوان بخش, name: heading, widget: string, required: false, default: "ثبت‌نام" }
              - { label: لینک فرم, name: url, widget: string, required: false, hint: "https://docs.google.com/forms/…" }
              - { label: توضیح بالای فرم, name: note, widget: text, required: false }
              - { label: ارتفاع (پیکسل), name: height, widget: number, required: false, default: 520 }
              - label: جای نمایش
                name: place
                widget: select
                options:
                  - { label: ستون اصلی, value: "main" }
                  - { label: کنار, value: "side" }
                default: "main"
          - label: 🔘 دکمه‌ها
            name: buttons
            widget: object
            fields:
              - { label: عنوان بخش, name: heading, widget: string, required: false }
              - { label: توضیح کوتاه, name: text, widget: text, required: false }
              - label: جای نمایش
                name: place
                widget: select
                options:
                  - { label: ستون اصلی, value: "main" }
                  - { label: کنار, value: "side" }
                default: "main"
              - label: دکمه‌ها
                name: items
                widget: list
                summary: "{{fields.label}}"
                fields:
                  - { label: متن دکمه, name: label, widget: string }
                  - { label: لینک, name: link, widget: string, hint: "https://… یا مسیر داخلی مثل amoozesh.html" }
                  - label: رنگ
                    name: style
                    widget: select
                    required: false
                    options:
                      - { label: طلایی, value: "gold" }
                      - { label: سرمه‌ای, value: "navy" }
                      - { label: آبی تلگرام, value: "tele" }
                      - { label: ساده با قاب, value: "ghost" }
                      - { label: سفید, value: "white" }
                    default: "navy"
                  - label: آیکن
                    name: icon
                    widget: select
                    required: false
                    options: [ "", "telegram", "whatsapp", "download", "calendar" ]
          - label: 🎯 تبلیغات موبایل (فقط جابه‌جایی)
            name: ads
            widget: object
            fields:
              - { label: راهنما, name: _hint, widget: hidden, default: "این بلوک فقط جای نمایش تبلیغات در موبایل را مشخص می‌کند؛ در کامپیوتر تبلیغات همیشه در ستون کنار بین «فهرست مطالب» و «اطلاعات کلی» است." }
      - label: انتشار
        name: active
        widget: boolean
        default: true

  - name: discounts
    label: تخفیف‌ها
    label_singular: تخفیف
    folder: content/discounts
    format: json
    create: true
    delete: true
    extension: json
    summary: "{{title}} — کد: {{code}}"
    fields:
      - { label: عنوان, name: title, widget: string, required: true }
      - { label: توضیح, name: description, widget: text, required: true }
      - { label: کد, name: code, widget: string, required: true }
      - { label: لینک, name: link, widget: string, required: false }
      - { label: اعتبار تا, name: expires, widget: string, required: true, default: "همیشگی" }
      - { label: فعال, name: active, widget: boolean, default: true }

  - name: courses
    label: دوره‌ها
    label_singular: دوره
    folder: content/courses
    format: json
    create: true
    delete: true
    extension: json
    summary: "{{title}} — {{teacher}}"
    sortable_fields:
      - field: date
        default_sort: desc
      - field: title
    fields:
      - { label: عنوان, name: title, widget: string, required: true }
      - label: تاریخ انتشار
        name: date
        widget: datetime
        required: true
        hint: "برای مرتب‌سازی «جدیدترین/قدیمی‌ترین» و نمایش تاریخ در کارت‌های فهرست دوره‌ها."
      - { label: زیرعنوان, name: subtitle, widget: string, required: false, hint: "مثل «پروژه‌محور و کاملاً آنلاین»" }
      - label: دسته
        name: category
        widget: select
        options: [ "مهارت نرم", "نرم‌افزار", "هوش مصنوعی", "برنامه‌نویسی", "زبان", "طراحی", "هنر و رسانه", "کارآفرینی" ]
        default: "مهارت نرم"
      - { label: توضیح, name: summary, widget: text, required: true }
      - { label: تگ‌ها / هشتگ‌ها, name: hashtags, widget: list, required: false, value_type: string, hint: "هر کلمه را تایپ و Enter بزن؛ با کلیک روی هر تگ، همان کلمه در جستجو می‌شود" }
      - { label: مدرس, name: teacher, widget: string, required: true }
      - { label: سمت مدرس, name: teacher_role, widget: string, required: false, hint: "مثل «عضو هیئت علمی دانشگاه سمنان»" }
      - { label: عکس مدرس, name: teacher_image, widget: image, required: false }
      - { label: معرفی کوتاه مدرس, name: teacher_bio, widget: text, required: false }
      - { label: لینک مدرس, name: teacher_link, widget: string, required: false, hint: "https://… (بیرونی)" }
      - { label: جلسات, name: lessons, widget: string, required: true, hint: "مثل «۶ جلسه آنلاین»" }
      - { label: مدت / ساختار (نمایشی), name: duration_label, widget: string, required: false, hint: "مثل «۶ هفته، هفتگی ۲ ساعت» — اگر خالی بود از «جلسات» استفاده می‌شود" }
      - { label: قیمت, name: price, widget: string, required: true, default: "رایگان" }
      - { label: تصویر, name: image, widget: image, required: false }
      - { label: لینک, name: link, widget: string, required: false, hint: "https://form/… یا مسیر داخلی؛ اگر خالی باشد دکمهٔ ثبت‌نام به کانال پلتفرم می‌رود" }
      - { label: ترتیب, name: sort, widget: number, required: false, default: 1 }
      - { label: فعال, name: active, widget: boolean, default: true }
      - label: سوالات متداول
        name: faq
        widget: list
        required: false
        collapsed: true
        summary: "{{fields.q}}"
        fields:
          - { label: پرسش, name: q, widget: string }
          - { label: پاسخ, name: a, widget: text }
      - label: بلوک‌های ستون اصلی
        name: blocks_main
        widget: list
        required: false
        label_singular: بلوک اصلی
        collapsed: true
        summary: "{{fields.heading}} — {{type}}"
        hint: "محتوای ستون اصلی (متن دوره) را در این لیست با ▲▼ بچین. هر آیتم یک بلوک مستقل است."
        default:
          - type: text
            heading: دربارهٔ دوره
            markdown: "توضیح کوتاهی دربارهٔ دوره بنویسید."
        types:
          - label: 📝 متن
            name: text
            widget: object
            fields:
              - { label: عنوان بخش, name: heading, widget: string, required: false }
              - { label: متن, name: markdown, widget: markdown }
          - label: ⭐ در یک نگاه
            name: highlights
            widget: object
            fields:
              - { label: عنوان بخش, name: heading, widget: string, required: false, default: "در یک نگاه" }
              - label: موارد
                name: items
                widget: list
                summary: "{{fields.text}}"
                fields:
                  - { label: مورد, name: text, widget: string }
          - label: 🧾 اطلاعات (ردیفی)
            name: facts
            widget: object
            fields:
              - { label: عنوان بخش, name: heading, widget: string, required: false }
              - label: ردیف‌ها
                name: items
                widget: list
                summary: "{{fields.label}} — {{fields.value}}"
                collapsed: true
                fields:
                  - { label: عنوان, name: label, widget: string, required: false }
                  - { label: مقدار, name: value, widget: string, required: false }
                  - label: آیکن
                    name: icon
                    widget: select
                    required: false
                    options: [ "", "check", "clock", "calendar", "users", "spark", "file", "download", "play", "bell", "money", "list", "layers", "monitor", "pin", "quote", "chart", "link", "telegram", "whatsapp" ]
          - label: 🖼 عکس
            name: image
            widget: object
            fields:
              - { label: تصویر, name: image, widget: image }
              - { label: کپشن, name: caption, widget: string, required: false }
              - { label: alt, name: alt, widget: string, required: false }
          - label: 🗂 گالری
            name: gallery
            widget: object
            fields:
              - { label: عنوان بخش, name: heading, widget: string, required: false }
              - label: تعداد ستون
                name: columns
                widget: select
                required: false
                options:
                  - { label: خودکار, value: "" }
                  - { label: ۲ ستون, value: "two" }
                  - { label: ۳ ستون, value: "three" }
                  - { label: ۴ ستون, value: "four" }
                default: ""
              - label: تصاویر
                name: items
                widget: list
                summary: "{{fields.caption}}"
                fields:
                  - { label: تصویر, name: image, widget: image }
                  - { label: کپشن, name: caption, widget: string, required: false }
          - label: 🎬 ویدیو (آپارات یا فایل)
            name: video
            widget: object
            fields:
              - { label: عنوان بخش, name: heading, widget: string, required: false }
              - { label: لینک آپارات, name: url, widget: string, required: false, hint: "مثل https://www.aparat.com/v/abc123" }
              - { label: یا فایل ویدیو, name: file, widget: file, required: false }
              - { label: عنوان ویدیو, name: title, widget: string, required: false }
              - { label: توضیح, name: caption, widget: string, required: false }
              - { label: پوستر, name: poster, widget: image, required: false }
          - label: ⏱ زمان‌بندی / سرفصل جلسات
            name: schedule
            widget: object
            fields:
              - { label: عنوان بخش, name: heading, widget: string, required: false, default: "برنامهٔ دوره" }
              - label: جلسات
                name: items
                widget: list
                summary: "{{fields.title}}"
                fields:
                  - { label: عنوان جلسه, name: title, widget: string, required: false }
                  - { label: زمان, name: time, widget: string, required: false, hint: "مثل «۱۵ مهر، ۱۸:۰۰»" }
                  - { label: مدت, name: duration, widget: string, required: false, hint: "مثل «۲ ساعت»" }
                  - { label: توضیح, name: note, widget: text, required: false }
          - label: 🎯 مخاطبین دوره
            name: audience
            widget: object
            fields:
              - { label: عنوان بخش, name: heading, widget: string, required: false, default: "مخاطبین دوره" }
              - { label: عنوان ستون مناسب, name: good_title, widget: string, required: false, default: "این دوره برای چه کسانی است؟" }
              - { label: عنوان ستون نامناسب, name: bad_title, widget: string, required: false, default: "این دوره برای چه کسانی نیست؟" }
              - label: مناسب برای
                name: suitable
                widget: list
                summary: "{{fields.text}}"
                fields:
                  - { label: مورد, name: text, widget: string }
              - label: نامناسب برای
                name: unsuitable
                widget: list
                summary: "{{fields.text}}"
                fields:
                  - { label: مورد, name: text, widget: string }
          - label: 🗂 تب‌ها
            name: tabs
            widget: object
            fields:
              - { label: عنوان بخش, name: heading, widget: string, required: false }
              - label: تب‌ها
                name: tabs
                widget: list
                summary: "{{fields.tab}}"
                fields:
                  - { label: عنوان تب, name: tab, widget: string }
                  - label: آیکن تب
                    name: icon
                    widget: select
                    required: false
                    options: [ "", "check", "clock", "calendar", "users", "spark", "file", "download", "play", "bell", "money", "list", "layers", "monitor", "pin", "quote", "chart", "link", "telegram", "whatsapp" ]
                  - { label: محتوای تب (متن), name: markdown, widget: markdown }
          - label: 💰 بلیت‌ها / قیمت‌ها
            name: prices
            widget: object
            fields:
              - { label: عنوان بخش, name: heading, widget: string, required: false, default: "بلیت‌های دوره" }
              - label: بلیت‌ها
                name: items
                widget: list
                summary: "{{fields.name}} — {{fields.price}}"
                fields:
                  - { label: نام بلیت, name: name, widget: string, hint: "مثل «حضور آنلاین»" }
                  - { label: قیمت, name: price, widget: string, hint: "مثل «۴۹۰ هزار تومان»" }
                  - label: امکانات
                    name: features
                    widget: list
                    summary: "{{fields.text}}"
                    fields:
                      - { label: مورد, name: text, widget: string }
                  - { label: ویژه (پیشنهاد), name: hot, widget: boolean, default: false }
                  - { label: لینک ثبت‌نام, name: link, widget: string, required: false, hint: "https://… یا مسیر داخلی" }
                  - { label: متن دکمه, name: cta, widget: string, required: false, default: "ثبت‌نام" }
          - label: 👤 کارت مدرس (بلوک)
            name: teacher
            widget: object
            fields:
              - { label: عنوان بخش, name: heading, widget: string, required: false }
              - { label: تیتر کوچک, name: kicker, widget: string, required: false, default: "مدرس دوره" }
              - { label: نام, name: name, widget: string, required: true }
              - { label: سمت, name: role, widget: string, required: false }
              - { label: معرفی کوتاه, name: bio, widget: text, required: false }
              - { label: عکس, name: image, widget: image, required: false }
              - { label: لینک, name: link, widget: string, required: false }
          - label: 👥 سوالات متداول (بلوک)
            name: faq
            widget: object
            fields:
              - { label: عنوان بخش, name: heading, widget: string, required: false, default: "سوالات متداول" }
              - label: سوالات
                name: items
                widget: list
                summary: "{{fields.q}}"
                fields:
                  - { label: سوال, name: q, widget: string }
                  - { label: پاسخ, name: a, widget: text }
          - label: 📣 اعلان
            name: notice
            widget: object
            fields:
              - { label: عنوان بخش, name: heading, widget: string, required: false }
              - label: نوع
                name: tone
                widget: select
                default: info
                options:
                  - { label: اطلاع‌رسانی, value: "info" }
                  - { label: هشدار, value: "warn" }
                  - { label: موفقیت, value: "success" }
                  - { label: خطر, value: "danger" }
              - { label: عنوان اعلان, name: title, widget: string, required: false }
              - { label: متن, name: text, widget: text, required: false }
          - label: 📊 آمار
            name: stats
            widget: object
            fields:
              - { label: عنوان بخش, name: heading, widget: string, required: false }
              - label: آیتم‌ها
                name: items
                widget: list
                summary: "{{fields.number}} {{fields.label}}"
                fields:
                  - { label: عدد, name: number, widget: string, hint: "مثل «۶ جلسه»" }
                  - { label: برچسب, name: label, widget: string, required: false }
                  - label: آیکن
                    name: icon
                    widget: select
                    required: false
                    options: [ "", "check", "clock", "calendar", "users", "spark", "file", "download", "play", "bell", "money", "list", "layers", "monitor", "pin", "quote", "chart", "link", "telegram", "whatsapp" ]
          - label: 💬 نقل قول
            name: quote
            widget: object
            fields:
              - { label: عنوان بخش, name: heading, widget: string, required: false }
