                    summary: "{{fields.q}}"
                    fields:
                      - { label: سوال, name: q, widget: string }
                      - { label: پاسخ, name: a, widget: text }
              - label: ⏳ مراحل / جدول زمانی
                name: timeline
                widget: object
                fields:
                  - { label: عنوان بخش, name: heading, widget: string, required: false, default: "مراحل عضویت" }
                  - label: مراحل
                    name: items
                    widget: list
                    summary: "{{fields.title}}"
                    fields:
                      - { label: برچسب, name: time, widget: string, required: false }
                      - { label: عنوان, name: title, widget: string, required: true }
                      - { label: توضیح, name: desc, widget: text, required: false }
              - label: 📣 اعلان
                name: notice
                widget: object
                fields:
                  - { label: عنوان, name: title, widget: string, required: false }
                  - { label: متن, name: text, widget: text, required: false }
                  - label: نوع
                    name: tone
                    widget: select
                    required: false
                    options:
                      - { label: اطلاع, value: "info" }
                      - { label: هشدار, value: "warn" }
                      - { label: موفق, value: "success" }
                      - { label: خطر, value: "danger" }
                    default: "info"
              - label: 🖼 عکس
                name: image
                widget: object
                fields:
                  - { label: تصویر, name: image, widget: image }
                  - { label: کپشن, name: caption, widget: string, required: false }
                  - { label: متن جایگزین, name: alt, widget: string, required: false }
              - label: 🗂 گالری
                name: gallery
                widget: object
                fields:
                  - { label: عنوان بخش, name: heading, widget: string, required: false }
                  - label: تعداد ستون
                    name: columns
                    widget: select
                    required: false
                    options:
                      - { label: خودکار, value: "" }
                      - { label: ۲ ستون, value: "two" }
                      - { label: ۳ ستون, value: "three" }
                      - { label: ۴ ستون, value: "four" }
                    default: ""
                  - label: تصاویر
                    name: items
                    widget: list
                    summary: "{{fields.caption}}"
                    fields:
                      - { label: تصویر, name: image, widget: image }
                      - { label: کپشن, name: caption, widget: string, required: false }
              - label: 🎬 ویدیو (آپارات یا فایل)
                name: video
                widget: object
                fields:
                  - { label: عنوان بخش, name: heading, widget: string, required: false }
                  - label: نوع
                    name: kind
                    widget: select
                    required: true
                    options:
                      - { label: آپارات, value: "aparat" }
                      - { label: فایل ویدیو, value: "file" }
                  - { label: شناسه یا لینک, name: src, widget: string, required: true, hint: "برای آپارات: کد ویدیو — برای فایل: لینک mp4" }
                  - label: فایل زیرنویس
                    name: subtitle
                    widget: object
                    required: false
                    fields:
                      - { label: فایل, name: src, widget: file }
                      - label: برچسب زیرنویس, name: label, widget: string, required: false }
              - label: 📁 فایل‌ها
                name: files
                widget: object
                fields:
                  - { label: عنوان بخش, name: heading, widget: string, required: false }
                  - label: فایل‌ها
                    name: items
                    widget: list
                    summary: "{{fields.title}}"
                    fields:
                      - { label: عنوان, name: title, widget: string }
                      - label: فایل, name: file, widget: file }
                      - { label: توضیح, name: note, widget: string, required: false }
              - label: 📊 آمار
                name: stats
                widget: object
                fields:
                  - { label: عنوان بخش, name: heading, widget: string, required: false }
                  - label: آیتم‌ها
                    name: items
                    widget: list
                    summary: "{{fields.number}} {{fields.label}}"
                    fields:
                      - { label: عدد, name: number, widget: string }
                      - { label: برچسب, name: label, widget: string, required: false }
                      - label: آیکن
                        name: icon
                        widget: select
                        required: false
                        options: [ "", "check", "clock", "calendar", "users", "spark", "file", "download", "play", "bell", "money", "list", "layers", "monitor", "pin", "quote", "chart", "link", "telegram", "whatsapp" ]
              - label: 💬 نقل قول
                name: quote
                widget: object
                fields:
                  - { label: متن, name: text, widget: text, required: true }
                  - { label: گوینده, name: author, widget: string, required: false }
                  - { label: سمت, name: role, widget: string, required: false }
                  - { label: عکس, name: avatar, widget: image, required: false }
              - label: 🔘 دکمه‌ها
                name: buttons
                widget: object
                fields:
                  - { label: توضیح, name: text, widget: text, required: false }
                  - label: دکمه‌ها
                    name: items
                    widget: list
                    summary: "{{fields.label}}"
                    fields:
                      - { label: متن, name: label, widget: string, required: true }
                      - { label: لینک, name: link, widget: string, required: true }
                      - label: رنگ
                        name: style
                        widget: select
                        required: false
                        options:
                          - { label: طلایی, value: "gold" }
                          - { label: سرمه‌ای, value: "navy" }
                          - { label: تلگرام, value: "tele" }
                          - { label: ساده, value: "ghost" }
                          - { label: سفید, value: "white" }
                        default: "navy"
              - label: 📍 نقشه (نشان)
                name: location
                widget: object
                fields:
                  - { label: عنوان بخش, name: heading, widget: string, required: false }
                  - { label: نام مکان, name: name, widget: string, required: false }
                  - { label: نشانی, name: address, widget: text, required: false }
                  - { label: لینک نقشه, name: map_url, widget: string, required: false, hint: "لینک امبد نقشه یا لینک اشتراک‌گذاری از اپ نشان (nshn.ir)" }
              - label: ➖ جداکننده
                name: divider
                widget: object
                fields:
                  - { label: متن روی خط, name: text, widget: string, required: false }
              - label: 📱 تبلیغات
                name: ads
                widget: object
                fields:
                  - label: جانمایی تبلیغات
                    name: position
                    widget: select
                    required: false
                    default: "here"
                    hint: "«همین‌جا» یعنی دقیقاً در همین نقطه از فهرست بالا؛ برای ابتدا یا انتهای صفحه گزینه‌های زیر را انتخاب کن. در موبایل و کامپیوتر یکسان نمایش داده می‌شود."
                    options:
                      - { label: همین‌جا (مطابق ترتیب لیست), value: "here" }
                      - { label: ابتدای صفحه (زیر تیتر), value: "start" }
                      - { label: انتهای صفحه (قبل از دکمهٔ بازگشت), value: "end" }
                  - { label: راهنما, name: _hint, widget: hidden, default: "بنرها از بخش «تبلیغات» داشبورد می‌آیند. اگر این بلوک در صفحه نباشد، تبلیغات خودکار انتهای صفحه نمایش داده می‌شود." }

  - name: kanonha
