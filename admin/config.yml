  # ================= آموزش‌های مجازی =================
  - name: courses
    label: آموزش‌های مجازی
    label_singular: دوره
    folder: content/courses
    format: json
    create: true
    delete: true
    extension: json
    summary: "{{title}} — {{teacher}}"
    # پیش‌فرضِ فهرست داشبورد: جدیدترین بر اساس تاریخ انتشار (تاریخ کامیت)
    sortable_fields:
      - field: commit_date
        default_sort: desc
      - field: title
    fields:
      - label: عنوان دوره
        name: title
        widget: string
        required: true
      - label: دسته‌بندی
        name: category
        widget: select
        options: [ "مهارت نرم", "نرم‌افزار", "هوش مصنوعی", "برنامه‌نویسی", "زبان", "طراحی", "هنر و رسانه", "کارآفرینی" ]
        default: "مهارت نرم"
      - label: توضیح کوتاه
        name: summary
        widget: text
        required: true
      - label: مدرس
        name: teacher
        widget: string
        required: true
      - label: تعداد جلسات
        name: lessons
        widget: string
        required: true
        hint: "مثلاً «۸ جلسه آنلاین»"
      - label: قیمت / برچسب قیمت
        name: price
        widget: string
        required: true
        default: "رایگان"
        hint: "مثلاً «رایگان» یا «ویژهٔ دانشجویان»"
      - label: تصویر دوره (آپلود از سیستم)
        name: image
        widget: image
        required: false
        hint: "عکس کارت و صفحهٔ همین دوره. بالای ۱۲۰۰ پیکسل و افقی باشد بهتر است."
      - label: یا آدرس تصویر (URL)
        name: image_url
        widget: string
        required: false
        hint: "به‌جای آپلود می‌توانی آدرس کامل تصویر (https://…) را وارد کنی. اگر هر دو پر باشند، عکس آپلودی اولویت دارد."
      - label: رنگ اول جلد (هگز) — فقط وقتی تصویر نداری
        name: cover_a
        widget: string
        required: false
        default: "#102A71"
        hint: "رنگ پشتیبان کاور دوره‌های بدون تصویر."
      - label: رنگ دوم جلد (هگز) — فقط وقتی تصویر نداری
        name: cover_b
        widget: string
        required: false
        default: "#1b3a8b"
      - label: لینک ثبت‌نام / جزئیات
        name: link
        widget: string
        required: false
        hint: "مثلاً amoozesh.html یا یک آدرس https://"
      - label: ترتیب نمایش
        name: sort
        widget: number
        required: false
        default: 1
      - label: نمایش در سایت
        name: active
        widget: boolean
        default: true

