# داشبورد — نسخهٔ ساده
backend:
  name: github
  repo: Sabetian02/semnan-platform
  branch: main
  base_url: https://auth.semnanplatform.ir
  auth_endpoint: auth
  client_id: Ov23lieTbxroaVOg1N4l

media_folder: assets/images/uploads
public_folder: assets/images/uploads

slug:
  encoding: unicode
  clean_accents: false
  sanitize_replacement: "-"

locale: fa

logo:
  src: ../assets/images/SVG/logo.svg
  show_in_header: true

display_url: https://semnanplatform.ir

collections:
  - name: news
    label: اطلاعیه‌ها
    label_singular: اطلاعیه
    folder: content/news
    format: json
    create: true
    delete: true
    extension: json
    summary: "{{title}} — {{category}}"
    sortable_fields:
      - field: date
        default_sort: desc
      - field: title
    fields:
      - label: عنوان
        name: title
        widget: string
        required: true
      - label: خلاصه
        name: summary
        widget: text
        required: true
      - label: دسته
        name: category
        widget: select
        options: [ "خبر", "رویداد", "فراخوان", "اطلاع‌رسانی", "دوره", "جدید", "تخفیف" ]
        default: "خبر"
      - label: کانون
        name: kanon
        widget: relation
        collection: kanonha
        search_fields: [ "name", "short" ]
        value_field: slug
        display_fields: [ "name" ]
        required: false
      - label: انجمن
        name: anjoman
        widget: relation
        collection: anjomanha
        search_fields: [ "name", "short" ]
        value_field: slug
        display_fields: [ "name" ]
        required: false
      - label: تصویر کاور
        name: image
        widget: image
        required: false
      - label: یا آدرس تصویر
        name: image_url
        widget: string
        required: false
        hint: "https://… — اگر هر دو پر باشد عکس آپلودی اولویت دارد"
      - label: تاریخ انتشار
        name: date
        widget: datetime
        required: true
      - label: بلوک‌های محتوا
        name: blocks
        widget: list
        required: false
        label_singular: بلوک
        collapsed: true
        summary: "{{fields.heading}} — {{type}}"
        hint: "هر بلوک را با ▲▼ جابجا کن و با «جای نمایش» بین ستون اصلی و کنار جابجا کن. اگر خالی باشد فقط خلاصه نمایش داده می‌شود."
        default:
          - type: ads
        types:
          - label: 📝 متن
            name: text
            widget: object
            fields:
              - { label: عنوان بخش, name: heading, widget: string, required: false }
              - label: جای نمایش
                name: place
                widget: select
                options:
                  - { label: ستون اصلی, value: "main" }
                  - { label: کنار, value: "side" }
                default: "main"
              - { label: متن, name: markdown, widget: markdown }
          - label: 🖼 عکس
            name: image
            widget: object
            fields:
              - { label: تصویر, name: image, widget: image }
              - { label: کپشن, name: caption, widget: string, required: false }
              - { label: alt, name: alt, widget: string, required: false }
              - label: جای نمایش
                name: place
                widget: select
                options:
                  - { label: ستون اصلی, value: "main" }
                  - { label: کنار, value: "side" }
                default: "main"
          - label: 🎬 ویدیو (آپارات)
            name: video
            widget: object
            fields:
              - { label: عنوان بخش, name: heading, widget: string, required: false }
              - { label: لینک آپارات, name: url, widget: string, required: false, hint: "مثل https://www.aparat.com/v/abc123 — فقط آپارات" }
              - { label: عنوان ویدیو, name: title, widget: string, required: false }
              - { label: توضیح, name: caption, widget: string, required: false }
              - label: جای نمایش
                name: place
                widget: select
                options:
                  - { label: ستون اصلی, value: "main" }
                  - { label: کنار, value: "side" }
                default: "main"
          - label: 📍 نقشه (نشان)
            name: location
            widget: object
            fields:
              - { label: عنوان بخش, name: heading, widget: string, required: false, default: "مکان برگزاری" }
              - { label: نام مکان, name: name, widget: string, required: false }
              - { label: نشانی, name: address, widget: string, required: false }
              - { label: لینک نشان, name: map_url, widget: string, required: false, hint: "از اپ نشان «اشتراک‌گذاری» بزن و لینک را این‌جا بگذار (nshn.ir یا neshan.org) — نقشه داخل صفحه نمایش داده می‌شود" }
              - label: جای نمایش
                name: place
                widget: select
                options:
                  - { label: ستون اصلی, value: "main" }
                  - { label: کنار, value: "side" }
                default: "main"
          - label: 📋 فرم گوگل
            name: form
            widget: object
            fields:
              - { label: عنوان بخش, name: heading, widget: string, required: false, default: "ثبت‌نام" }
              - { label: لینک فرم, name: url, widget: string, required: false, hint: "https://docs.google.com/forms/…" }
              - { label: توضیح بالای فرم, name: note, widget: text, required: false }
              - { label: ارتفاع (پیکسل), name: height, widget: number, required: false, default: 520 }
              - label: جای نمایش
                name: place
                widget: select
                options:
                  - { label: ستون اصلی, value: "main" }
                  - { label: کنار, value: "side" }
                default: "main"
          - label: 🔘 دکمه‌ها
            name: buttons
            widget: object
            fields:
              - { label: عنوان بخش, name: heading, widget: string, required: false }
              - { label: توضیح کوتاه, name: text, widget: text, required: false }
              - label: جای نمایش
                name: place
                widget: select
                options:
                  - { label: ستون اصلی, value: "main" }
                  - { label: کنار, value: "side" }
                default: "main"
              - label: دکمه‌ها
                name: items
                widget: list
                summary: "{{fields.label}}"
                fields:
                  - { label: متن دکمه, name: label, widget: string }
                  - { label: لینک, name: link, widget: string, hint: "https://… یا مسیر داخلی مثل amoozesh.html" }
                  - label: رنگ
                    name: style
                    widget: select
                    required: false
                    options:
                      - { label: طلایی, value: "gold" }
                      - { label: سرمه‌ای, value: "navy" }
                      - { label: آبی تلگرام, value: "tele" }
                      - { label: ساده با قاب, value: "ghost" }
                      - { label: سفید, value: "white" }
                    default: "navy"
                  - label: آیکن
                    name: icon
                    widget: select
                    required: false
                    options: [ "", "telegram", "whatsapp", "download", "calendar" ]
          - label: 🎯 تبلیغات موبایل (فقط جابه‌جایی)
            name: ads
            widget: object
            fields:
              - { label: راهنما, name: _hint, widget: hidden, default: "این بلوک فقط جای نمایش تبلیغات در موبایل را مشخص می‌کند؛ در کامپیوتر تبلیغات همیشه در ستون کنار بین «فهرست مطالب» و «اطلاعات کلی» است." }
      - label: انتشار
        name: active
        widget: boolean
        default: true

  - name: discounts
    label: تخفیف‌ها
    label_singular: تخفیف
    folder: content/discounts
    format: json
    create: true
    delete: true
    extension: json
    summary: "{{title}} — کد: {{code}}"
    fields:
      - { label: عنوان, name: title, widget: string, required: true }
      - { label: توضیح, name: description, widget: text, required: true }
      - { label: کد, name: code, widget: string, required: true }
      - { label: لینک, name: link, widget: string, required: false }
      - { label: اعتبار تا, name: expires, widget: string, required: true, default: "همیشگی" }
      - { label: فعال, name: active, widget: boolean, default: true }

  - name: courses
    label: دوره‌ها
    label_singular: دوره
    folder: content/courses
    format: json
    create: true
    delete: true
    extension: json
    summary: "{{title}} — {{teacher}}"
    sortable_fields:
      - field: commit_date
        default_sort: desc
      - field: title
    fields:
      - { label: عنوان, name: title, widget: string, required: true }
      - label: دسته
        name: category
        widget: select
        options: [ "مهارت نرم", "نرم‌افزار", "هوش مصنوعی", "برنامه‌نویسی", "زبان", "طراحی", "هنر و رسانه", "کارآفرینی" ]
        default: "مهارت نرم"
      - { label: توضیح, name: summary, widget: text, required: true }
      - { label: مدرس, name: teacher, widget: string, required: true }
      - { label: جلسات, name: lessons, widget: string, required: true }
      - { label: قیمت, name: price, widget: string, required: true, default: "رایگان" }
      - { label: تصویر, name: image, widget: image, required: false }
      - { label: آدرس تصویر, name: image_url, widget: string, required: false }
      - { label: رنگ اول, name: cover_a, widget: string, required: false, default: "#102A71" }
      - { label: رنگ دوم, name: cover_b, widget: string, required: false, default: "#1b3a8b" }
      - { label: لینک, name: link, widget: string, required: false }
      - { label: ترتیب, name: sort, widget: number, required: false, default: 1 }
      - { label: فعال, name: active, widget: boolean, default: true }

  - name: kanonha
    label: کانون‌ها
    label_singular: کانون
    folder: content/kanonha
    format: json
    create: true
    delete: true
    extension: json
    summary: "{{short}}"
    fields:
      - { label: شناسه, name: slug, widget: string, required: true }
      - { label: نام کامل, name: name, widget: string, required: true }
      - { label: نام کوتاه, name: short, widget: string, required: true }
      - { label: تلگرام, name: telegram, widget: string, required: false }
      - { label: درباره, name: desc, widget: text, required: true }
      - label: اعضا
        name: members
        widget: list
        required: false
        summary: "{{fields.name}} — {{fields.major}}"
        fields:
          - { label: نام, name: name, widget: string, required: true }
          - { label: رشته, name: major, widget: string, required: true }
          - { label: عنوان, name: title, widget: string, required: false }
          - { label: مقام, name: post, widget: string, required: false }
      - label: گالری
        name: gallery
        widget: list
        required: false
        fields:
          - { label: تصویر, name: image, widget: image }
          - { label: کپشن, name: caption, widget: string, required: false }

  - name: anjomanha
    label: انجمن‌ها
    label_singular: انجمن
    folder: content/anjomanha
    format: json
    create: true
    delete: true
    extension: json
    summary: "{{short}}"
    fields:
      - { label: شناسه, name: slug, widget: string, required: true }
      - { label: نام کامل, name: name, widget: string, required: true }
      - { label: نام کوتاه, name: short, widget: string, required: true }
      - { label: تلگرام, name: telegram, widget: string, required: false }
      - { label: درباره, name: desc, widget: text, required: true }
      - label: اعضا
        name: members
        widget: list
        required: false
        summary: "{{fields.name}} — {{fields.major}}"
        fields:
          - { label: نام, name: name, widget: string, required: true }
          - { label: رشته, name: major, widget: string, required: true }
          - { label: عنوان, name: title, widget: string, required: false }
          - { label: مقام, name: post, widget: string, required: false }
      - label: گالری
        name: gallery
        widget: list
        required: false
        fields:
          - { label: تصویر, name: image, widget: image }
          - { label: کپشن, name: caption, widget: string, required: false }

  - name: home
    label: صفحه اصلی
    files:
      - name: home
        label: صفحه اصلی
        file: content/home.json
        format: json
        fields:
          - label: هیرو
            name: hero
            widget: object
            fields:
              - { label: بج, name: badge, widget: string }
              - { label: عنوان قبل, name: title_before, widget: string }
              - { label: عنوان زرد, name: title_highlight, widget: string }
              - { label: لید, name: lead, widget: text }
              - { label: تلگرام, name: telegram_url, widget: string }
              - { label: متن دکمه, name: cta_tele_text, widget: string }
              - label: آمار
                name: stats
                widget: list
                fields:
                  - { label: عدد, name: number, widget: string }
                  - { label: توضیح, name: label, widget: string }
              - label: کارت‌ها
                name: card_items
                widget: list
                fields:
                  - { label: آیکن, name: icon, widget: string }
                  - { label: تون, name: tone, widget: select, options: ["gold","navy","light"], default: "navy" }
                  - { label: عنوان, name: title, widget: string }
                  - { label: توضیح, name: desc, widget: string }
                  - { label: لینک, name: link, widget: string }
                  - { label: متن لینک, name: link_text, widget: string }
          - label: تبلیغات (دو بنر مشترک صفحهٔ اصلی، اطلاعیه‌ها و دوره‌ها)
            name: ads
            widget: object
            fields:
              - label: بنر ۱
                name: slot1
                widget: object
                fields:
                  - { label: تصویر, name: image, widget: image }
                  - { label: لینک, name: link, widget: string }
                  - { label: فعال, name: active, widget: boolean, default: true }
              - label: بنر ۲
                name: slot2
                widget: object
                fields:
                  - { label: تصویر, name: image, widget: image }
                  - { label: لینک, name: link, widget: string }
                  - { label: فعال, name: active, widget: boolean, default: true }
              - label: رزرو تبلیغات
                name: reserve
                widget: object
                fields:
                  - { label: متن, name: label, widget: string }
                  - { label: لینک, name: link, widget: string }
