      - label: تنظیمات سئو و اشتراک‌گذاری (اختیاری)
        name: seo
        widget: object
        required: false
        collapsed: true
        hint: "اگر خالی بمانی، عنوان و خلاصهٔ همین فرم استفاده می‌شود. پر کردن این بخش برای گوگل و پیش‌نمایش تلگرام توصیه می‌شود."
        fields:
          - label: عنوان در گوگل و تب مرورگر
            name: title
            widget: string
            required: false
            hint: "حدود ۶۰ کاراکتر؛ اگر خالی باشد عنوان اصلی استفاده می‌شود."
          - label: توضیح متا (زیر عنوان در گوگل)
            name: description
            widget: text
            required: false
            hint: "حدود ۱۵۰ کاراکتر؛ در پیش‌نمایش لینک در تلگرام و گوگل نمایش داده می‌شود."
          - label: تصویر اشتراک‌گذاری (OG)
            name: image
            widget: image
            required: false
            hint: "تصویر پیش‌نمایش لینک در تلگرام و شبکه‌های اجتماعی؛ اندازهٔ پیشنهادی ۱۲۰۰×۶۳۰."
          - label: نشانی یکتای صفحه (canonical)
            name: canonical
            widget: string
            required: false
          - label: خارج کردن از نتایج گوگل (noindex)
            name: noindex
            widget: boolean
            required: false
            default: false
      - label: نمایش در سایت
        name: active
        widget: boolean
        default: true
        hint: "روشن = منتشر شود | خاموش = پیش‌نویس و در سایت دیده نشود."

