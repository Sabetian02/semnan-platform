# ==========================================================
# داشبورد مدیریت سایت — پلتفرم دانشگاه سمنان
# ==========================================================
backend:
  name: github
  repo: Sabetian02/semnan-platform
  branch: main
  base_url: https://auth.semnanplatform.ir
  auth_endpoint: auth
  client_id: Ov23lieTbxroaVOg1N4l

# آپلود عکس‌ها و فایل‌ها
media_folder: assets/images/uploads
public_folder: assets/images/uploads

slug:
  encoding: unicode
  clean_accents: false
  sanitize_replacement: "-"

# رابط مدیریت کاملاً فارسی
locale: fa

# برند (لوگو) در صفحه ورود و هدر
logo:
  src: ../assets/images/SVG/logo.svg
  show_in_header: true

# لینک «مشاهده سایت» در بالای دشبورد
display_url: https://semnanplatform.ir

collections:
  # ================= اطلاعیه‌ها و اخبار =================
  - name: news
    label: اطلاعیه‌ها و اخبار
    label_singular: اطلاعیه
    folder: content/news
    format: json
    create: true
    delete: true
    extension: json
    summary: "{{title}} — {{category}}"
    fields:
      - label: عنوان
        name: title
        widget: string
        required: true
      - label: خلاصه خبر
        name: summary
        widget: text
        required: true
      - label: متن کامل اطلاعیه
        name: body
        widget: markdown
        required: false
        hint: "متن بلند و کامل اطلاعیه. میتوانی با # تیتر بزنی، با - لیست بسازی و با خطِ خالی پاراگراف عوض کنی. صفحهٔ جداگانهٔ همین اطلاعیه از این متن ساخته میشود."
      - label: دسته‌بندی
        name: category
        widget: select
        options: [ "جدید", "رویداد", "فراخوان", "اطلاع‌رسانی", "دوره", "خبر" ]
        default: "خبر"
      - label: کانون مرجع (اختیاری)
        name: kanon
        widget: relation
        collection: kanonha
        search_fields: [ "name", "short" ]
        value_field: slug
        display_fields: [ "name" ]
        required: false
        hint: >
          اگر این اطلاعیه متعلق به یک کانون است، همان کانون را انتخاب کن.
          به‌صورت خودکار در صفحهٔ پروفایل آن کانون و صفحهٔ اصلی سایت نمایش داده می‌شود
          و اعلان هم می‌گیرد.
      - label: انجمن مرجع (اختیاری)
        name: anjoman
        widget: relation
        collection: anjomanha
        search_fields: [ "name", "short" ]
        value_field: slug
        display_fields: [ "name" ]
        required: false
        hint: >
          اگر این اطلاعیه متعلق به یک انجمن علمی است، همان انجمن را انتخاب کن.
          به‌صورت خودکار در صفحهٔ پروفایل آن انجمن و صفحهٔ اصلی سایت نمایش داده می‌شود
          و اعلان هم می‌گیرد.
      - label: لینک «اطلاعات بیشتر»
        name: link
        widget: string
        required: false
        hint: "مثلاً amoozesh.html یا یک آدرس کامل https://"
      - label: تصویر شاخص (آپلود از سیستم — اختیاری)
        name: image
        widget: image
        required: false
        hint: "از سیستم آپلود کن؛ در کارت و صفحهٔ همین اطلاعیه نمایش داده می‌شود."
      - label: یا آدرس تصویر (URL — اختیاری)
        name: image_url
        widget: string
        required: false
        hint: "به‌جای آپلود می‌توانی آدرس کامل تصویر (https://…) را وارد کنی. اگر هر دو پر باشند، عکس آپلودی اولویت دارد."
      - label: تاریخ انتشار
        name: date
        widget: datetime
        required: true
      - label: نمایش در سایت
        name: active
        widget: boolean
        default: true

  # ================= تخفیف‌های دانشجویی =================
  - name: discounts
    label: تخفیف‌های دانشجویی
    label_singular: تخفیف
    folder: content/discounts
    format: json
    create: true
    delete: true
    extension: json
    summary: "{{title}} — کد: {{code}}"
    fields:
      - label: عنوان تخفیف
        name: title
        widget: string
        required: true
        hint: "مثلاً «۱۰٪ تخفیف ویژه دانشجویان»"
      - label: توضیح کوتاه
        name: description
        widget: text
        required: true
      - label: کد تخفیف
        name: code
        widget: string
        required: true
        hint: "مثلاً UNI10"
      - label: اطلاعات بیشتر (اختیاری)
        name: link
        widget: string
        required: false
        hint: "لینک صفحه مقصد — اگر خالی باشد دکمه‌ای نمایش داده نمی‌شود"
      - label: اعتبار تا
        name: expires
        widget: string
        required: true
        default: "همیشگی"
        hint: "«همیشگی» بنویس، یا تاریخ اعتبار را خودت تایپ کن، مثلاً: ۱۵ آبان"
      - label: وضعیت تخفیف
        name: active
        widget: boolean
        required: true
        default: true
        hint: "روشن = فعال در سایت | خاموش = منقضی و مخفی"

  # ================= آموزش‌های مجازی =================
  - name: courses
    label: آموزش‌های مجازی
    label_singular: دوره
    folder: content/courses
    format: json
    create: true
    delete: true
    extension: json
    summary: "{{title}} — {{teacher}}"
    fields:
      - label: عنوان دوره
        name: title
        widget: string
        required: true
      - label: دسته‌بندی
        name: category
        widget: select
        options: [ "مهارت نرم", "نرم‌افزار", "هوش مصنوعی", "برنامه‌نویسی", "زبان", "طراحی", "هنر و رسانه", "کارآفرینی" ]
        default: "مهارت نرم"
      - label: توضیح کوتاه
        name: summary
        widget: text
        required: true
      - label: مدرس
        name: teacher
        widget: string
        required: true
      - label: تعداد جلسات
        name: lessons
        widget: string
        required: true
        hint: "مثلاً «۸ جلسه آنلاین»"
      - label: قیمت / برچسب قیمت
        name: price
        widget: string
        required: true
        default: "رایگان"
        hint: "مثلاً «رایگان» یا «ویژهٔ دانشجویان»"
      - label: تصویر دوره (آپلود از سیستم)
        name: image
        widget: image
        required: false
        hint: "عکس کارت و صفحهٔ همین دوره. بالای ۱۲۰۰ پیکسل و افقی باشد بهتر است."
      - label: یا آدرس تصویر (URL)
        name: image_url
        widget: string
        required: false
        hint: "به‌جای آپلود می‌توانی آدرس کامل تصویر (https://…) را وارد کنی. اگر هر دو پر باشند، عکس آپلودی اولویت دارد."
      - label: رنگ اول جلد (هگز) — فقط وقتی تصویر نداری
        name: cover_a
        widget: string
        required: false
        default: "#102A71"
        hint: "رنگ پشتیبان کاور دوره‌های بدون تصویر."
      - label: رنگ دوم جلد (هگز) — فقط وقتی تصویر نداری
        name: cover_b
        widget: string
        required: false
        default: "#1b3a8b"
      - label: لینک ثبت‌نام / جزئیات
        name: link
        widget: string
        required: false
        hint: "مثلاً amoozesh.html یا یک آدرس https://"
      - label: ترتیب نمایش
        name: sort
        widget: number
        required: false
        default: 1
      - label: نمایش در سایت
        name: active
        widget: boolean
        default: true

