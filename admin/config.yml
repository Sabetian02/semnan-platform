  - name: home
    label: صفحه اصلی
    files:
      - name: home
        label: صفحه اصلی
        file: content/home.json
        format: json
        fields:
          - label: هیرو
            name: hero
            widget: object
            fields:
              - { label: بج, name: badge, widget: string }
              - { label: عنوان قبل, name: title_before, widget: string }
              - { label: عنوان زرد, name: title_highlight, widget: string }
              - { label: لید, name: lead, widget: text }
              - { label: تلگرام, name: telegram_url, widget: string }
              - { label: متن دکمه, name: cta_tele_text, widget: string }
              - label: آمار
                name: stats
                widget: list
                fields:
                  - { label: عدد, name: number, widget: string }
                  - { label: توضیح, name: label, widget: string }
              - label: کارت‌ها
                name: card_items
                widget: list
                fields:
                  - { label: آیکن, name: icon, widget: string }
                  - { label: تون, name: tone, widget: select, options: ["gold","navy","light"], default: "navy" }
                  - { label: عنوان, name: title, widget: string }
                  - { label: توضیح, name: desc, widget: string }
                  - { label: لینک, name: link, widget: string }
                  - { label: متن لینک, name: link_text, widget: string }

  - name: ads
    label: تبلیغات و بنرها
    files:
      - name: ads
        label: تبلیغات سراسری
        file: content/ads.json
        format: json
        fields:
          - label: بنر ۱
            name: slot1
            widget: object
            fields:
              - { label: تصویر, name: image, widget: image }
              - { label: لینک, name: link, widget: string }
              - { label: فعال, name: active, widget: boolean, default: true }
          - label: بنر ۲
            name: slot2
            widget: object
            fields:
              - { label: تصویر, name: image, widget: image }
              - { label: لینک, name: link, widget: string }
              - { label: فعال, name: active, widget: boolean, default: true }
          - label: نمایش در صفحهٔ اصلی
            name: show_home
            widget: boolean
            default: true
          - label: نمایش در صفحات دوره‌ها (هر دوره)
            name: show_courses
            widget: boolean
            default: true
          - label: نمایش در صفحات اطلاعیه
            name: show_announcements
            widget: boolean
            default: true
          - label: ابعاد بنرها (نسبت نمایش)
            name: banner_size
            hint: "ابعاد فعلی: ۳۸۸ × ۱۰۰ پیکسل — با تغییر این دو عدد، نسبت بنرها در همهٔ بخش‌های سایت عوض می‌شود."
            widget: object
            fields:
              - { label: عرض بنر (پیکسل), name: width, widget: number, min: 60, default: 388 }
              - { label: ارتفاع بنر (پیکسل), name: height, widget: number, min: 12, default: 100 }
          - label: رزرو تبلیغات (صفحهٔ اصلی)
            name: reserve
            widget: object
            fields:
              - { label: متن, name: label, widget: string }
              - { label: لینک, name: link, widget: string }
              - label: نماد دکمه
                name: icon
                widget: select
                options:
                  - { label: تلگرام, value: telegram }
                  - { label: بدون آیکون, value: none }
                  - { label: فایل SVG سفارشی, value: custom }
                default: telegram
              - label: فایل آیکون (SVG) — فقط وقتی گزینهٔ بالا «فایل SVG سفارشی» باشد
                name: icon_svg
                widget: image
